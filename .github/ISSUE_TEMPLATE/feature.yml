name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Lead with the **problem or use case**, not just a proposed solution — it makes it
        much easier to find a design that fits the rest of the app.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case, and how you work around it today.
      placeholder: I want new episodes from a subscription to land in a per-show folder so Jellyfin picks them up automatically…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. What you imagine the feature looking like.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools that do this well, other approaches you thought about.
